[project]
name = "office-agent"
version = "0.1.0"
description = "Office Agent RS: notulen rapat jadi minutes, action items, dan follow-up, dengan persetujuan manusia"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0,<2", "pydantic>=2.9.0", "fastapi", "uvicorn"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
